
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo Randomizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
  background: #191919;
  color: #e6e6e6;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .bingo-banner {
  display: block;
  width: 100%;
  max-width: 850px;
  height: auto;
  margin: 0 auto;
}

    .bingo-board {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      max-width: 850px;
      margin: 25px auto 0;
    }

    .bingo-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
      min-width: 0;
      overflow: hidden;
      border: 2px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
      padding: 4px;
      transition: background-color 0.2s;
    }

    .bingo-cell img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* Thick, hollow red completion circle */
    .bingo-cell.completed::after {
      content: "";
      position: absolute;
      width: 72%;
      height: 72%;
      border: 9px solid red;
      border-radius: 50%;
      pointer-events: none;
    }

    .bingo-cell.completed {
      border-color: red;
    }

    #randomizeBtn {
      display: block;
      margin: 24px auto;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #randomizeBtn:hover {
      background: #444;
    }

    @media (max-width: 500px) {
      body {
        padding: 10px;
      }

      .bingo-board {
        gap: 4px;
      }

      .bingo-cell {
        padding: 2px;
        border-radius: 4px;
      }

      .bingo-cell.completed::after {
        border-width: 5px;
      }
    }
  </style>
</head>

<body>
    <img
  class="bingo-banner"
  src="https://github.com/loidtourne/LT_Notion_Bingo/blob/main/images/banner2.png?raw=true"
  alt="Bingo Banner"
/>
  <div id="bingoBoard" class="bingo-board"></div>

  <button id="randomizeBtn" type="button">
    Randomize Board
  </button>

  <script>
    // Replace these paths with your 25 image sources.
    const imageSources = [
      "images/image1.png",
      "images/image2.png",
      "images/image3.png",
      "images/image4.png",
      "images/image5.png",
      "images/image6.png",
      "images/image7.png",
      "images/image8.png",
      "images/image9.png",
      "images/image10.png",
      "images/image11.png",
      "images/image12.png",
      "images/image13.png",
      "images/image14.png",
      "images/image15.png",
      "images/image16.png",
      "images/image17.png",
      "images/image18.png",
      "images/image19.png",
      "images/image20.png",
      "images/image21.png",
      "images/image22.png",
      "images/image23.png",
      "images/image24.png",
      "images/image25.png"
    ];

    // Light pastel color palette.
    const pastelColors = [
      "#FFDDE2", // Soft pink
      "#D9EAFD", // Baby blue
      "#DDF5E3", // Mint green
      "#FFF0CC", // Soft yellow
      "#E8DEFF", // Lavender
      "#FFE2CC", // Peach
      "#D9F3F0", // Aqua
      "#F8DDF0", // Light pink
      "#E7F0D5", // Pale green
      "#F3E5D5"  // Cream
    ];

    const board = document.getElementById("bingoBoard");
    const randomizeBtn = document.getElementById("randomizeBtn");

    // Each image keeps its own completion state.
    let bingoItems = imageSources.map((src, index) => ({
      id: index,
      src: src,
      completed: false,
      color: null
    }));

    // Fisher-Yates shuffle.
    function shuffle(array) {
      const shuffled = [...array];

      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[j]] =
          [shuffled[j], shuffled[i]];
      }

      return shuffled;
    }

    // Generate colors with no matching horizontal
    // or vertical neighbors.
    function generatePastelColors() {
      const colors = [];

      for (let i = 0; i < 25; i++) {
        const row = Math.floor(i / 5);
        const col = i % 5;

        const forbidden = new Set();

        // Check the cell to the left.
        if (col > 0) {
          forbidden.add(colors[i - 1]);
        }

        // Check the cell above.
        if (row > 0) {
          forbidden.add(colors[i - 5]);
        }

        const available = pastelColors.filter(
          color => !forbidden.has(color)
        );

        const chosenColor =
          available[
            Math.floor(Math.random() * available.length)
          ];

        colors.push(chosenColor);
      }

      return colors;
    }

    // Render all 25 cells.
    function renderBoard() {
      board.innerHTML = "";

      bingoItems.forEach((item) => {
        const cell = document.createElement("div");
        cell.className = "bingo-cell";

        // Apply the pastel color for this grid position.
        cell.style.backgroundColor = item.color;

        if (item.completed) {
          cell.classList.add("completed");
        }

        cell.setAttribute("role", "button");
        cell.setAttribute("tabindex", "0");
        cell.setAttribute(
          "aria-label",
          item.completed
            ? "Completed. Click to unmark."
            : "Not completed. Click to mark."
        );
        cell.setAttribute(
          "aria-pressed",
          String(item.completed)
        );

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = `Bingo item ${item.id + 1}`;
        img.draggable = false;

        // Toggle the red circle on and off.
        function toggleCompleted() {
          item.completed = !item.completed;
          renderBoard();
        }

        cell.addEventListener("click", toggleCompleted);

        cell.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleCompleted();
          }
        });

        cell.appendChild(img);
        board.appendChild(cell);
      });
    }

    // Shuffle images and create a new pastel layout.
    function randomizeBoard() {
      bingoItems = shuffle(bingoItems);

      const colors = generatePastelColors();

      // Colors belong to positions, while completion
      // states belong to images.
      bingoItems.forEach((item, index) => {
        item.color = colors[index];
      });

      renderBoard();
    }

    // Randomize on initial page load.
    randomizeBoard();

    // Randomize whenever the button is clicked.
    randomizeBtn.addEventListener("click", randomizeBoard);
  </script>
</body>
</html>
