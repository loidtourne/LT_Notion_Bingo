
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo Randomizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #191919;
    }

    body {
      padding: 24px;
      color: #e6e6e6;
      font-family: Arial, sans-serif;
    }

    h1 {
      margin: 0;
      text-align: center;
      font-size: 28px;
    }

        .bingo-banner {
  display: block;
  width: 100%;
  max-width: 850px;
  height: auto;
  margin: 0 auto;
}

    p {
      margin: 12px 0 0;
      text-align: center;
      color: #cccccc;
    }

    .bingo-board {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      max-width: 850px;
      margin: 25px auto 0;
    }

    .bingo-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      padding: 5px;
      border: 2px solid #555555;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .bingo-cell:hover {
      transform: scale(1.025);
    }

    .bingo-cell img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .bingo-cell.completed::after {
      content: "";
      position: absolute;
      width: 48%;
      height: 48%;
      border: 9px solid red;
      border-radius: 50%;
      pointer-events: none;
    }

    #randomizeBtn {
      display: block;
      margin: 24px auto;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #FF003C;
      color: #191919;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #randomizeBtn:hover {
      background: #cccccc;
    }

    #randomizeBtn:focus-visible,
    .bingo-cell:focus-visible {
      outline: 3px solid #75baff;
      outline-offset: 3px;
    }

    @media (max-width: 600px) {
      body {
        padding: 10px;
      }

      h1 {
        font-size: 23px;
      }

      .bingo-board {
        gap: 4px;
        margin-top: 20px;
      }

      .bingo-cell {
        padding: 3px;
        border-width: 1px;
        border-radius: 5px;
      }

      .bingo-cell.completed::after {
        border-width: 5px;
      }

      #randomizeBtn {
        margin: 20px auto;
      }
    }
  </style>
</head>

<body>
    <img
  class="bingo-banner"
  src="https://github.com/loidtourne/LT_Notion_Bingo/blob/main/images/banner2.png?raw=true"
  alt="Bingo Banner"
/>

  <div
    id="bingoBoard"
    class="bingo-board"
    aria-label="Bingo board"
  ></div>

  <button id="randomizeBtn" type="button">
    Randomize Board
  </button>

  <script>
    // ==========================================
    // 1. IMAGE SOURCES
    // Replace these 25 URLs with your own images.
    // ==========================================

    const imageSources = [
 "images/image1.png",
      "images/image2.png",
      "images/image3.png",
      "images/image4.png",
      "images/image5.png",
      "images/image6.png",
      "images/image7.png",
      "images/image8.png",
      "images/image9.png",
      "images/image10.png",
      "images/image11.png",
      "images/image12.png",
      "images/image13.png",
      "images/image14.png",
      "images/image15.png",
      "images/image16.png",
      "images/image17.png",
      "images/image18.png",
      "images/image19.png",
      "images/image20.png",
      "images/image21.png",
      "images/image22.png",
      "images/image23.png",
      "images/image24.png",
      "images/image25.png"
    ];

    // ==========================================
    // 2. SETTINGS AND INITIAL DATA
    // ==========================================

    const STORAGE_KEY = "bingoRandomizerState";

    const pastelColors = [
      "#FFD6D6",
      "#FFE5B4",
      "#FFF2B2",
      "#D9F2D9",
      "#CDEFEA",
      "#D6E6FF",
      "#DDD6FF",
      "#F0D6FF",
      "#FFD6EA",
      "#E8E8E8"
    ];

    let bingoItems = imageSources.map((src, index) => ({
      id: index,
      src,
      completed: false,
      color: null
    }));

    const bingoBoard = document.getElementById("bingoBoard");
    const randomizeBtn = document.getElementById("randomizeBtn");

    // ==========================================
    // 3. SHUFFLE THE BOARD
    // ==========================================

    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [array[i], array[j]] = [array[j], array[i]];
      }

      return array;
    }

    // ==========================================
    // 4. GENERATE COLORS
    // No matching colors horizontally or vertically.
    // ==========================================

    function generatePastelColors() {
      const colors = [];

      for (let i = 0; i < 25; i++) {
        const row = Math.floor(i / 5);
        const col = i % 5;

        const forbidden = [];

        // Color immediately to the left.
        if (col > 0) {
          forbidden.push(colors[i - 1]);
        }

        // Color immediately above.
        if (row > 0) {
          forbidden.push(colors[i - 5]);
        }

        const available = pastelColors.filter(
          color => !forbidden.includes(color)
        );

        const chosen =
          available[Math.floor(Math.random() * available.length)];

        colors.push(chosen);
      }

      return colors;
    }

    // ==========================================
    // 5. SAVE THE CURRENT BOARD
    // Saves order, completion, colors, and image URLs.
    // ==========================================

    function saveBoard() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(bingoItems)
        );
      } catch (error) {
        console.warn("Unable to save Bingo board:", error);
      }
    }

    // ==========================================
    // 6. RESTORE THE PREVIOUS BOARD
    // ==========================================

    function loadBoard() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) return false;

        const parsed = JSON.parse(saved);

        // Validate the saved board before restoring it.
        if (
          !Array.isArray(parsed) ||
          parsed.length !== imageSources.length
        ) {
          return false;
        }

        const validIds = new Set(
          imageSources.map((_, index) => index)
        );

        const savedIds = new Set(parsed.map(item => item.id));

        if (
          savedIds.size !== imageSources.length ||
          parsed.some(item => !validIds.has(item.id)) ||
          parsed.some(item =>
            typeof item.src !== "string" ||
            typeof item.completed !== "boolean" ||
            !pastelColors.includes(item.color)
          )
        ) {
          return false;
        }

        // Restore the saved order and status.
        bingoItems = parsed.map(item => ({
          id: item.id,
          src: imageSources[item.id],
          completed: item.completed,
          color: item.color
        }));

        return true;
      } catch (error) {
        console.warn("Unable to restore Bingo board:", error);
        return false;
      }
    }

    // ==========================================
    // 7. DRAW THE BOARD
    // ==========================================

    function renderBoard() {
      bingoBoard.innerHTML = "";

      bingoItems.forEach(item => {
        const cell = document.createElement("div");

        cell.className = "bingo-cell";

        if (item.completed) {
          cell.classList.add("completed");
        }

        cell.style.backgroundColor = item.color;
        cell.tabIndex = 0;
        cell.setAttribute("role", "button");

        cell.setAttribute(
          "aria-label",
          `Bingo item ${item.id + 1}, ${
            item.completed ? "completed" : "not completed"
          }`
        );

        cell.setAttribute(
          "aria-pressed",
          String(item.completed)
        );

        const img = document.createElement("img");

        img.src = item.src;
        img.alt = `Bingo item ${item.id + 1}`;
        img.loading = "lazy";
        img.draggable = false;

        // Toggle completion and save immediately.
        function toggleCompleted() {
          item.completed = !item.completed;

          saveBoard();
          renderBoard();
        }

        cell.addEventListener("click", toggleCompleted);

        cell.addEventListener("keydown", event => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleCompleted();
          }
        });

        cell.appendChild(img);
        bingoBoard.appendChild(cell);
      });
    }

    // ==========================================
    // 8. RANDOMIZE AND RESET
    // ==========================================

    function randomizeBoard() {
      // Clear all completed circles.
      bingoItems.forEach(item => {
        item.completed = false;
      });

      // Shuffle the images.
      shuffleArray(bingoItems);

      // Generate a new color layout.
      const colors = generatePastelColors();

      // Assign colors to the shuffled positions.
      bingoItems.forEach((item, index) => {
        item.color = colors[index];
      });

      // Save the new board before displaying it.
      saveBoard();

      renderBoard();
    }

    // ==========================================
    // 9. STARTUP
    // Restore the saved board instead of reshuffling.
    // ==========================================

    if (loadBoard()) {
      renderBoard();
    } else {
      randomizeBoard();
    }

    randomizeBtn.addEventListener("click", randomizeBoard);
  </script>

</body>
</html>
