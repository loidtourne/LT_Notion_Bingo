
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bingo Randomizer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f3f3f3;
      color: #222;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    #randomizeBtn {
      margin: 15px 0 25px;
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: #222;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #randomizeBtn:hover {
      background: #444;
    }

    .bingo-board {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    .bingo-cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1 / 1;
      min-width: 0;
      overflow: hidden;
      background: white;
      border: 2px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
      padding: 4px;
    }

    .bingo-cell img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* Large red O for completed images */
.bingo-cell.completed::after {
  content: "";
  position: absolute;
  width: 72%;
  height: 72%;
  border: 9px solid red;
  border-radius: 50%;
  pointer-events: none;
}

    .bingo-cell.completed {
      border-color: red;
    }

    @media (max-width: 500px) {
      body {
        padding: 10px;
      }

      .bingo-board {
        gap: 4px;
      }

      .bingo-cell {
        padding: 2px;
        border-radius: 4px;
      }
    }
  </style>
</head>

<body>
  <h1>Bingo Randomizer</h1>
  <p>Click an image to mark it complete!</p>

<div id="bingoBoard" class="bingo-board"></div>

<button id="randomizeBtn" type="button">
  Randomize Board
</button>

  <script>
    // Replace these paths with your 25 image sources.
    const imageSources = [
      "images/image1.png",
      "images/image2.png",
      "images/image3.png",
      "images/image4.png",
      "images/image5.png",
      "images/image6.png",
      "images/image7.png",
      "images/image8.png",
      "images/image9.png",
      "images/image10.png",
      "images/image11.png",
      "images/image12.png",
      "images/image13.png",
      "images/image14.png",
      "images/image15.png",
      "images/image16.png",
      "images/image17.png",
      "images/image18.png",
      "images/image19.png",
      "images/image20.png",
      "images/image21.png",
      "images/image22.png",
      "images/image23.png",
      "images/image24.png",
      "images/image25.png"
    ];

    const board = document.getElementById("bingoBoard");
    const randomizeBtn = document.getElementById("randomizeBtn");

    // Each image keeps its own completion state.
    let bingoItems = imageSources.map((src, index) => ({
      id: index,
      src: src,
      completed: false
    }));

    // Fisher-Yates shuffle for a fair random order.
    function shuffle(array) {
      const shuffled = [...array];

      for (let i = shuffled.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));

        [shuffled[i], shuffled[j]] =
          [shuffled[j], shuffled[i]];
      }

      return shuffled;
    }

    // Draw the board using the current image order.
    function renderBoard() {
      board.innerHTML = "";

      bingoItems.forEach((item) => {
        const cell = document.createElement("div");
        cell.className = "bingo-cell";

        if (item.completed) {
          cell.classList.add("completed");
        }

        cell.setAttribute("role", "button");
        cell.setAttribute("tabindex", "0");
        cell.setAttribute(
          "aria-label",
          item.completed
            ? "Completed. Click to unmark."
            : "Not completed. Click to mark."
        );
        cell.setAttribute(
          "aria-pressed",
          String(item.completed)
        );

        const img = document.createElement("img");
        img.src = item.src;
        img.alt = `Bingo item ${item.id + 1}`;
        img.draggable = false;

        // Toggle the red X on and off.
        function toggleCompleted() {
          item.completed = !item.completed;
          renderBoard();
        }

        cell.addEventListener("click", toggleCompleted);

        cell.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            toggleCompleted();
          }
        });

        cell.appendChild(img);
        board.appendChild(cell);
      });
    }

    // Shuffle images without losing completion states.
    randomizeBtn.addEventListener("click", () => {
      bingoItems = shuffle(bingoItems);
      renderBoard();
    });

// Shuffle the board when the page first loads.
bingoItems = shuffle(bingoItems);
renderBoard();
  </script>
</body>
</html>
